name: Gateway Bank
kind: company
description: Gateway Bank Ltd is a 100% customer-owned Australian mutual bank headquartered
  in Sydney, New South Wales. Founded in 1955 as Gateway Credit Union and rebranded
  to Gateway Bank in 2018, it is an APRA-regulated Authorised Deposit-taking Institution
  (ADI) serving more than 30,000 members with over one billion dollars in assets across
  transaction and savings accounts, home, personal and car loans, reverse and commercial
  mortgages, term deposits and Visa debit cards. As an active ADI, Gateway Bank is
  a designated data holder under Australia's Consumer Data Right (CDR / Open Banking)
  and implements the full Data Standards Body (DSB) Consumer Data Standards Banking
  API surface - a public, unauthenticated Product Reference Data (PRD) API plus the
  consumer-authorized Accounts, Balances, Transactions, Direct Debits, Scheduled Payments
  and Payees endpoints accessed through the CDR Accredited Data Recipient model. Its
  registered CDR public base URI is https://public.cdr-api.gatewaybank.com.au. As a
  small customer-owned mutual, Gateway Bank does not operate a broader self-serve
  first-party developer portal beyond these CDR obligations.
